<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reseplaneraren</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="topbar">
  <a href="index.html" class="btn-back"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;flex-shrink:0"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg> Mina resor</a>
  <div class="topbar-actions">
    <span id="user-email"></span>
    <button class="btn-ghost" id="logout-btn">Logga ut</button>
  </div>
</div>

<div id="app">
  <div id="map"></div>
  <div id="sidebar">
    <div id="sidebar-header">
      <h1 id="trip-title">Laddar resa…</h1>
      <button type="button" id="edit-trip-btn" class="modal-close" title="Redigera resmål" aria-label="Redigera resmål"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
      <p id="trip-sub">Sök adress eller klicka på kartan för att lägga till boende.</p>
      <button type="button" id="add-place-btn" class="btn-primary" title="Lägg till boende" aria-label="Lägg till boende"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px"><path d="M12 5v14"/><path d="M5 12h14"/></svg> <span class="btn-label">Lägg till boende</span></button>
    </div>
    <div id="filter-row" role="group" aria-label="Filtrera boendetyp">
      <button class="filter-chip active" data-filter="all">Alla</button>
      <button class="filter-chip f-fricamping" data-filter="fricamping">🚐 Fricamping</button>
      <button class="filter-chip f-stallplats" data-filter="stallplats">🅿️ Ställplats</button>
      <button class="filter-chip f-taltplats" data-filter="taltplats">🏕️ Tältplats</button>
      <button class="filter-chip f-camping" data-filter="camping">⛺ Camping</button>
      <button class="filter-chip f-stuga" data-filter="stuga">🏡 Stuga/Airbnb</button>
      <button class="filter-chip f-hotell" data-filter="hotell">🏨 Hotell</button>
    </div>
    <div id="amenity-filter-row" role="group" aria-label="Filtrera på bekvämligheter">
      <button class="amenity-chip" data-amenity="is_favorite">★ Favoriter</button>
      <button class="amenity-chip" data-amenity="near_badplats">🏖️ Strandnära</button>
      <button class="amenity-chip" data-amenity="has_shower">🚿 Dusch</button>
      <button class="amenity-chip" data-amenity="has_wifi">📶 WiFi</button>
      <button class="amenity-chip" data-amenity="has_power">🔌 El</button>
      <button class="amenity-chip" data-amenity="pets_allowed">🐶 Husdjur</button>
      <button class="amenity-chip" data-amenity="has_kitchen">🍳 Kök</button>
    </div>
    <div id="list"></div>
    <div id="legend">
      <span><span class="legend-dot" style="background:var(--fricamping)"></span>Fricamping</span>
      <span><span class="legend-dot" style="background:var(--stallplats)"></span>Ställplats</span>
      <span><span class="legend-dot" style="background:var(--taltplats)"></span>Tältplats</span>
      <span><span class="legend-dot" style="background:var(--camping)"></span>Camping</span>
      <span><span class="legend-dot" style="background:var(--stuga)"></span>Stuga/Airbnb</span>
      <span><span class="legend-dot" style="background:var(--hotell)"></span>Hotell</span>
    </div>
  </div>
</div>

<button type="button" id="mobile-fab-add" aria-label="Lägg till boende">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
</button>

<div id="mobile-tabbar" role="tablist" aria-label="Visa karta eller lista">
  <button type="button" class="active" data-view="map" aria-label="Karta">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18l-6 3V6l6-3 6 3 6-3v15l-6 3-6-3Z"/><path d="M9 3v15"/><path d="M15 6v15"/></svg>
  </button>
  <button type="button" data-view="list" aria-label="Lista">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h13"/><path d="M8 12h13"/><path d="M8 18h13"/><path d="M3 6h.01"/><path d="M3 12h.01"/><path d="M3 18h.01"/></svg>
  </button>
</div>

<div id="place-modal-overlay" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <div class="modal-header">
      <h2 id="place-modal-title">Lägg till boende</h2>
      <button type="button" id="place-modal-close" class="modal-close" aria-label="Stäng"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg></button>
    </div>
    <div class="field" id="place-search-wrap" style="position:relative;">
      <label for="place-search">Adress eller plats</label>
      <input type="text" id="place-search" placeholder="Sök adress, plats eller stad" autocomplete="off">
      <div class="geo-results" id="place-geo-results"></div>
      <div class="geo-picked" id="place-geo-picked" style="display:none;"></div>
    </div>
    <div id="place-fields"></div>
  </div>
</div>

<div id="edit-trip-modal-overlay" class="modal-overlay" style="display:none;">
  <div class="modal-card">
    <div class="modal-header">
      <h2>Redigera resmål</h2>
      <button type="button" id="edit-trip-modal-close" class="modal-close" aria-label="Stäng"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="M6 6l12 12"/></svg></button>
    </div>
    <div class="field">
      <label for="edit-trip-name">Namn på resan</label>
      <input type="text" id="edit-trip-name">
    </div>
    <div class="field" style="position:relative;">
      <label for="edit-trip-dest">Resmål</label>
      <input type="text" id="edit-trip-dest" placeholder="Sök en stad eller plats" autocomplete="off">
      <div class="geo-results" id="edit-geo-results"></div>
      <div class="geo-picked" id="edit-geo-picked" style="display:none;"></div>
    </div>
    <button type="button" class="btn-primary" id="edit-trip-save">Spara ändringar</button>
    <div class="form-msg" id="edit-trip-msg"></div>
  </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script type="module" src="config.js"></script>
<script type="module" src="js/tripDetail.js"></script>
</body>
</html>
