<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reseplaneraren · Mina resor</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="topbar" style="display:none;">
  <a href="index.html" class="brand">🧭 <span class="brand-text">Reseplaneraren</span></a>
  <div class="topbar-actions">
    <span id="user-email"></span>
    <button class="btn-ghost" id="logout-btn">Logga ut</button>
  </div>
</div>

<div id="auth-screen">
  <div class="auth-card">
    <h1 id="auth-title">Logga in</h1>
    <p class="sub" id="auth-sub">Logga in för att se och planera era resor.</p>
    <form id="auth-form">
      <div class="field">
        <label for="auth-email">E-post</label>
        <input type="email" id="auth-email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="auth-password">Lösenord</label>
        <input type="password" id="auth-password" required autocomplete="current-password" minlength="6">
      </div>
      <button type="submit" class="btn-primary" id="auth-submit">Logga in</button>
      <div class="form-msg" id="auth-msg"></div>
    </form>
    <div class="auth-toggle">
      <span id="auth-toggle-text">Inget konto än?</span>
      <button type="button" id="auth-toggle-btn">Registrera dig</button>
    </div>
  </div>
</div>

<div id="trips-screen" style="display:none;">
  <h1>Mina resor</h1>
  <p class="sub">Skapa en resa per resmål — lägg sedan in boendealternativ, sovplatser eller stopp på kartan.</p>

  <div id="new-trip-card">
    <h2>+ Ny resa</h2>
    <form id="new-trip-form">
      <div class="field">
        <label for="trip-name">Namn på resan</label>
        <input type="text" id="trip-name" placeholder="t.ex. Way Out West 2026" required>
      </div>
      <div class="field" style="position:relative;">
        <label for="trip-dest">Resmål</label>
        <input type="text" id="trip-dest" placeholder="Sök en stad eller plats, t.ex. Göteborg" autocomplete="off" required>
        <div class="geo-results" id="geo-results"></div>
        <div class="geo-picked" id="geo-picked" style="display:none;"></div>
      </div>
      <button type="submit" class="btn-primary" id="new-trip-submit" disabled>Skapa resa</button>
      <div class="form-msg" id="new-trip-msg"></div>
    </form>
  </div>

  <div id="trip-grid"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script type="module" src="config.js"></script>
<script type="module" src="js/trips.js"></script>
</body>
</html>
